name: Deploy
on:
  push:
    branches: [main]   # or master, whichever the resume repo uses
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: cd /www/resume && git pull --ff-only
